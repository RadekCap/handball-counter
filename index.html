<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handball Counter | 1. NH Brno</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Open+Sans:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            color: #303030;
            font-family: 'Open Sans', sans-serif;
            position: relative;
        }


        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            border: 2px solid rgba(223, 0, 0, 0.06);
        }

        .title {
            font-family: 'Russo One', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #df0000;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #707070;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .section-title {
            font-family: 'Russo One', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #707070;
            margin-bottom: 0.5rem;
        }

        .next-training {
            font-family: 'Russo One', sans-serif;
            font-size: 1.4rem;
            color: #303030;
            margin-bottom: 2.5rem;
        }

        .next-training .day-name {
            color: #df0000;
        }

        .next-match {
            font-family: 'Russo One', sans-serif;
            font-size: 1.1rem;
            color: #303030;
            margin-bottom: 0.3rem;
        }

        .next-match .match-teams {
            color: #df0000;
        }

        .match-detail {
            font-size: 0.85rem;
            color: #707070;
            margin-bottom: 2rem;
        }

        .countdown {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .countdown-item {
            background: #f5f5f5;
            border: 2px solid #df0000;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            min-width: 100px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .countdown-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(223, 0, 0, 0.2);
        }

        .countdown-value {
            font-family: 'Russo One', sans-serif;
            font-size: 3.5rem;
            color: #df0000;
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        .countdown-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #707070;
        }

        .countdown-small .countdown-item {
            min-width: 70px;
            padding: 1rem 0.7rem;
        }

        .countdown-small .countdown-value {
            font-size: 2.5rem;
        }

        .club-logo {
            width: 120px;
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
        }

        .training-info {
            font-size: 0.85rem;
            color: #afafaf;
            letter-spacing: 1px;
        }

        .divider {
            width: 60%;
            margin: 2.5rem auto;
            border: none;
            border-top: 2px solid rgba(223, 0, 0, 0.1);
        }

        /* Schedule table */
        .schedule-section {
            margin-top: 1rem;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .schedule-table th {
            font-family: 'Russo One', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #707070;
            padding: 0.6rem 0.4rem;
            border-bottom: 2px solid #df0000;
            text-align: left;
        }

        .schedule-table td {
            padding: 0.5rem 0.4rem;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .schedule-table tr:hover {
            background: #fdf5f5;
        }

        .schedule-table tr.past-match {
            opacity: 0.4;
        }

        .schedule-table tr.next-match-row {
            background: #fff5f5;
            font-weight: 700;
        }

        .schedule-table .home-badge {
            display: inline-block;
            background: #df0000;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.3rem;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @media (max-width: 500px) {
            .countdown {
                gap: 0.8rem;
            }
            .countdown-item {
                min-width: 75px;
                padding: 1rem 0.6rem;
            }
            .countdown-value {
                font-size: 2.5rem;
            }
            .countdown-small .countdown-item {
                min-width: 55px;
                padding: 0.7rem 0.4rem;
            }
            .countdown-small .countdown-value {
                font-size: 1.8rem;
            }
            .next-training {
                font-size: 1.1rem;
            }
            .next-match {
                font-size: 0.95rem;
            }
            .schedule-table {
                font-size: 0.75rem;
            }
            .schedule-table th,
            .schedule-table td {
                padding: 0.4rem 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://1nhbrno.cz/photo/xmax6.png" alt="1. NH Brno" class="club-logo">

        <div class="section-title">Trénink</div>
        <div class="next-training" id="next-training">
            <span id="training-prefix">Příští trénink: </span>
            <span class="day-name" id="training-day"></span>
        </div>

        <div class="countdown" id="countdown-training">
            <div class="countdown-item">
                <div class="countdown-value" id="days">--</div>
                <div class="countdown-label" id="days-label">dny</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">--</div>
                <div class="countdown-label" id="hours-label">hodiny</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">--</div>
                <div class="countdown-label" id="minutes-label">minuty</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value pulse" id="seconds">--</div>
                <div class="countdown-label" id="seconds-label">sekundy</div>
            </div>
        </div>

        <div class="training-info">Tréninky: středa a pátek v 16:00</div>

        <hr class="divider">

        <div class="section-title">Zápas</div>
        <div class="next-match" id="next-match-info">
            <span id="match-teams" class="match-teams"></span>
        </div>
        <div class="match-detail" id="match-detail"></div>

        <div class="countdown countdown-small" id="countdown-match">
            <div class="countdown-item">
                <div class="countdown-value" id="m-days">--</div>
                <div class="countdown-label" id="m-days-label">dny</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="m-hours">--</div>
                <div class="countdown-label" id="m-hours-label">hodiny</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="m-minutes">--</div>
                <div class="countdown-label" id="m-minutes-label">minuty</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value pulse" id="m-seconds">--</div>
                <div class="countdown-label" id="m-seconds-label">sekundy</div>
            </div>
        </div>

        <hr class="divider">

        <div class="schedule-section">
            <div class="section-title">Rozpis zápasů JARO 2025/2026</div>
            <table class="schedule-table" id="schedule-table">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Den</th>
                        <th>Čas</th>
                        <th>Domácí - Hosté</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ── Match schedule data ──
        const MATCHES = [
            { date: '2026-04-12', time: '13:45', day: 'neděle', home: 'TJ Olbramovice', away: '1. NH BRNO' },
            { date: '2026-04-26', time: '13:45', day: 'neděle', home: '1. NH BRNO', away: 'TJ Sokol Vracov' },
            { date: '2026-05-17', time: '08:00', day: 'neděle', home: 'TJ Jiskra Humpolec A', away: '1. NH BRNO' },
            { date: '2026-05-17', time: '11:45', day: 'neděle', home: 'TJ Jiskra Humpolec B', away: '1. NH BRNO' },
            { date: '2026-05-24', time: '13:15', day: 'neděle', home: 'Draken Brno A', away: '1. NH BRNO' },
            { date: '2026-05-24', time: '15:30', day: 'neděle', home: 'Draken Brno B', away: '1. NH BRNO' },
            { date: '2026-05-30', time: '10:15', day: 'sobota', home: 'TJ Miroslav', away: '1. NH BRNO' },
            { date: '2026-06-07', time: '12:00', day: 'neděle', home: 'SK Autonot Jihlava', away: '1. NH BRNO' },
        ];

        // ── Training countdown logic ──
        const DAY_NAMES = {
            3: 'Středa v 16:00',
            5: 'Pátek v 16:00'
        };

        const TRAINING_DAYS = [3, 5];
        const TRAINING_HOUR = 16;

        function getNextTraining() {
            const now = new Date();
            const pragueNow = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Prague' }));

            const currentDay = pragueNow.getDay();
            const currentHour = pragueNow.getHours();
            const currentMinute = pragueNow.getMinutes();
            const currentSecond = pragueNow.getSeconds();

            let daysUntil = null;

            for (let offset = 0; offset <= 7; offset++) {
                const targetDay = (currentDay + offset) % 7;
                if (TRAINING_DAYS.includes(targetDay)) {
                    if (offset === 0) {
                        const pastTraining = currentHour > TRAINING_HOUR ||
                            (currentHour === TRAINING_HOUR && currentMinute > 0) ||
                            (currentHour === TRAINING_HOUR && currentMinute === 0 && currentSecond > 0);
                        if (pastTraining) continue;
                    }
                    daysUntil = offset;
                    break;
                }
            }

            const target = new Date(pragueNow);
            target.setDate(target.getDate() + daysUntil);
            target.setHours(TRAINING_HOUR, 0, 0, 0);

            const targetDay = (currentDay + daysUntil) % 7;

            return { target, pragueNow, dayName: DAY_NAMES[targetDay] };
        }

        function updateTrainingCountdown() {
            const { target, pragueNow, dayName } = getNextTraining();

            const diff = target - pragueNow;

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            document.getElementById('training-day').textContent = dayName;

            document.getElementById('days-label').textContent = getDayLabel(days);
            document.getElementById('hours-label').textContent = getHourLabel(hours);
            document.getElementById('minutes-label').textContent = getMinuteLabel(minutes);
            document.getElementById('seconds-label').textContent = getSecondLabel(seconds);
        }

        // ── Match countdown logic ──
        function getMatchDateTime(match) {
            const [h, m] = match.time.split(':').map(Number);
            const d = new Date(match.date + 'T00:00:00');
            d.setHours(h, m, 0, 0);
            return d;
        }

        function getNextMatch() {
            const now = new Date();
            const pragueNow = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Prague' }));

            for (const match of MATCHES) {
                const matchTime = getMatchDateTime(match);
                if (matchTime > pragueNow) {
                    return { match, matchTime, pragueNow };
                }
            }
            return null;
        }

        function updateMatchCountdown() {
            const result = getNextMatch();
            if (!result) {
                document.getElementById('match-teams').textContent = 'Sezóna skončila';
                document.getElementById('match-detail').textContent = '';
                document.getElementById('countdown-match').style.display = 'none';
                return;
            }

            const { match, matchTime, pragueNow } = result;

            const teamsText = match.home + ' - ' + match.away;
            document.getElementById('match-teams').textContent = teamsText;

            const dateFormatted = matchTime.toLocaleDateString('cs-CZ', { day: '2-digit', month: '2-digit', year: 'numeric' });
            document.getElementById('match-detail').textContent = match.day + ' ' + dateFormatted + ' v ' + match.time;

            const diff = matchTime - pragueNow;
            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('m-days').textContent = days;
            document.getElementById('m-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('m-minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('m-seconds').textContent = String(seconds).padStart(2, '0');

            document.getElementById('m-days-label').textContent = getDayLabel(days);
            document.getElementById('m-hours-label').textContent = getHourLabel(hours);
            document.getElementById('m-minutes-label').textContent = getMinuteLabel(minutes);
            document.getElementById('m-seconds-label').textContent = getSecondLabel(seconds);
        }

        // ── Schedule table ──
        function renderSchedule() {
            const now = new Date();
            const pragueNow = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Prague' }));
            const nextMatch = getNextMatch();
            const tbody = document.getElementById('schedule-body');

            MATCHES.forEach(match => {
                const matchTime = getMatchDateTime(match);
                const isPast = matchTime <= pragueNow;
                const isNext = nextMatch && match.date === nextMatch.match.date && match.time === nextMatch.match.time;
                const isHome = match.home === '1. NH BRNO';

                const tr = document.createElement('tr');
                if (isPast) tr.classList.add('past-match');
                if (isNext) tr.classList.add('next-match-row');

                const dateFormatted = matchTime.toLocaleDateString('cs-CZ', { day: '2-digit', month: '2-digit', year: 'numeric' });

                const tdDate = document.createElement('td');
                tdDate.textContent = dateFormatted;
                tr.appendChild(tdDate);

                const tdDay = document.createElement('td');
                tdDay.textContent = match.day;
                tr.appendChild(tdDay);

                const tdTime = document.createElement('td');
                tdTime.textContent = match.time;
                tr.appendChild(tdTime);

                const tdTeams = document.createElement('td');
                tdTeams.textContent = match.home + ' - ' + match.away;
                if (isHome) {
                    const badge = document.createElement('span');
                    badge.className = 'home-badge';
                    badge.textContent = 'DOMA';
                    tdTeams.appendChild(badge);
                }
                tr.appendChild(tdTeams);

                tbody.appendChild(tr);
            });
        }

        // ── Czech labels ──
        function getDayLabel(n) {
            if (n === 1) return 'den';
            if (n >= 2 && n <= 4) return 'dny';
            return 'dní';
        }

        function getHourLabel(n) {
            if (n === 1) return 'hodina';
            if (n >= 2 && n <= 4) return 'hodiny';
            return 'hodin';
        }

        function getMinuteLabel(n) {
            if (n === 1) return 'minuta';
            if (n >= 2 && n <= 4) return 'minuty';
            return 'minut';
        }

        function getSecondLabel(n) {
            if (n === 1) return 'sekunda';
            if (n >= 2 && n <= 4) return 'sekundy';
            return 'sekund';
        }

        // ── Init ──
        updateTrainingCountdown();
        updateMatchCountdown();
        renderSchedule();
        setInterval(() => {
            updateTrainingCountdown();
            updateMatchCountdown();
        }, 1000);
    </script>
</body>
</html>
