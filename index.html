<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handball Counter | 1. NH Brno</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Open+Sans:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #303030;
            font-family: 'Open Sans', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Handball court lines background */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            border: 2px solid rgba(223, 0, 0, 0.06);
            border-radius: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 2px solid rgba(223, 0, 0, 0.06);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }

        .title {
            font-family: 'Russo One', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #df0000;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #707070;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .next-training {
            font-family: 'Russo One', sans-serif;
            font-size: 1.4rem;
            color: #303030;
            margin-bottom: 2.5rem;
        }

        .next-training .day-name {
            color: #df0000;
        }

        .countdown {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .countdown-item {
            background: #f5f5f5;
            border: 2px solid #df0000;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            min-width: 100px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .countdown-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(223, 0, 0, 0.2);
        }

        .countdown-value {
            font-family: 'Russo One', sans-serif;
            font-size: 3.5rem;
            color: #df0000;
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        .countdown-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #707070;
        }

        .club-logo {
            width: 120px;
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
        }

        .training-info {
            font-size: 0.85rem;
            color: #afafaf;
            letter-spacing: 1px;
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @media (max-width: 500px) {
            .countdown {
                gap: 0.8rem;
            }
            .countdown-item {
                min-width: 75px;
                padding: 1rem 0.6rem;
            }
            .countdown-value {
                font-size: 2.5rem;
            }
            .next-training {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://1nhbrno.cz/photo/xmax6.png" alt="1. NH Brno" class="club-logo">
        <div class="subtitle">Handball Counter</div>

        <div class="next-training" id="next-training">
            <span id="training-prefix">Příští trénink: </span>
            <span class="day-name" id="training-day"></span>
        </div>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="countdown-value" id="days">--</div>
                <div class="countdown-label" id="days-label">dny</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">--</div>
                <div class="countdown-label" id="hours-label">hodiny</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">--</div>
                <div class="countdown-label" id="minutes-label">minuty</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value pulse" id="seconds">--</div>
                <div class="countdown-label" id="seconds-label">sekundy</div>
            </div>
        </div>

        <div class="training-info">Tréninky: středa a pátek v 16:00</div>
    </div>

    <script>
        const DAY_NAMES = {
            3: 'Středa v 16:00',
            5: 'Pátek v 16:00'
        };

        const TRAINING_DAYS = [3, 5]; // Wednesday = 3, Friday = 5
        const TRAINING_HOUR = 16;

        function getNextTraining() {
            const now = new Date();
            const pragueNow = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Prague' }));

            const currentDay = pragueNow.getDay();
            const currentHour = pragueNow.getHours();
            const currentMinute = pragueNow.getMinutes();
            const currentSecond = pragueNow.getSeconds();

            let daysUntil = null;

            for (let offset = 0; offset <= 7; offset++) {
                const targetDay = (currentDay + offset) % 7;
                if (TRAINING_DAYS.includes(targetDay)) {
                    if (offset === 0) {
                        const pastTraining = currentHour > TRAINING_HOUR ||
                            (currentHour === TRAINING_HOUR && currentMinute > 0) ||
                            (currentHour === TRAINING_HOUR && currentMinute === 0 && currentSecond > 0);
                        if (pastTraining) continue;
                    }
                    daysUntil = offset;
                    break;
                }
            }

            const target = new Date(pragueNow);
            target.setDate(target.getDate() + daysUntil);
            target.setHours(TRAINING_HOUR, 0, 0, 0);

            const targetDay = (currentDay + daysUntil) % 7;

            return { target, pragueNow, dayName: DAY_NAMES[targetDay] };
        }

        function updateCountdown() {
            const { target, pragueNow, dayName } = getNextTraining();

            const diff = target - pragueNow;

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            document.getElementById('training-day').textContent = dayName;

            document.getElementById('days-label').textContent = getDayLabel(days);
            document.getElementById('hours-label').textContent = getHourLabel(hours);
            document.getElementById('minutes-label').textContent = getMinuteLabel(minutes);
            document.getElementById('seconds-label').textContent = getSecondLabel(seconds);
        }

        function getDayLabel(n) {
            if (n === 1) return 'den';
            if (n >= 2 && n <= 4) return 'dny';
            return 'dní';
        }

        function getHourLabel(n) {
            if (n === 1) return 'hodina';
            if (n >= 2 && n <= 4) return 'hodiny';
            return 'hodin';
        }

        function getMinuteLabel(n) {
            if (n === 1) return 'minuta';
            if (n >= 2 && n <= 4) return 'minuty';
            return 'minut';
        }

        function getSecondLabel(n) {
            if (n === 1) return 'sekunda';
            if (n >= 2 && n <= 4) return 'sekundy';
            return 'sekund';
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
